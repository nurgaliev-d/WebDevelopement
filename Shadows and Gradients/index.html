<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Shadows and Gradients</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Task 1 -->
<section>
    <h2>Task 1 - Box Shadow</h2>

    <div class="container">
        <div class="box shadow1">Shadow 1</div>
        <div class="box shadow2">Shadow 2</div>
        <div class="box shadow3">Shadow 3</div>
    </div>
</section>

<!-- Task 2 -->
<section>
    <h2>Task 2 - Text Shadow</h2>

    <h1 class="text1">Gray Shadow</h1>
    <h1 class="text2">Blue Shadow</h1>
    <h2 class="text3">Red Shadow</h2>
</section>

<!-- Task 3 -->
<section>
    <h2>Task 3 - Linear Gradient</h2>

    <div class="container">
        <div class="gradient linear1"></div>
        <div class="gradient linear2"></div>
        <div class="gradient linear3"></div>
    </div>
</section>

<!-- Task 4 -->
<section>
    <h2>Task 4 - Radial Gradient</h2>

    <div class="container">
        <div class="gradient radial1"></div>
        <div class="gradient radial2"></div>
    </div>
</section>

</body>
</html>
